apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway-system
      sectionName: https
  hostnames:
    - netbox.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /netbox/static/
        - path:
            type: PathPrefix
            value: /netbox/media/
      backendRefs:
        - name: netbox-static
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /netbox/
      backendRefs:
        - name: netbox
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-static
  namespace: netbox
spec:
  selector:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/instance: netbox
    app.kubernetes.io/component: netbox
  ports:
    - name: http
      port: 80
      targetPort: static-http
