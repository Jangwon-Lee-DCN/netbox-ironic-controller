global:
  storageClass: example-rwo

allowedHosts:
  - netbox.example.com
  - netbox
  - netbox.netbox.svc
  - netbox.netbox.svc.cluster.local

basePath: netbox/
loginRequired: true
csrf:
  trustedOrigins:
    - https://netbox.example.com
timeZone: Asia/Seoul
defaultLanguage: ko-kr

# Accepted immutable image built from Dockerfile.netbox by the serialized DCN
# image queue. Production acceptance is recorded by the central change contract.
image:
  registry: registry.dcn.ssu.ac.kr
  repository: openstack/netbox
  tag: port-panel-87c5d4afa4794802c2d1
  digest: sha256:1b3cadad59e4859594a75938ed73c6eb57d8005a5201c60002fc7537a265f1d1
  pullPolicy: IfNotPresent
plugins:
  - netbox_dcn_port_panel
pluginsConfig:
  netbox_dcn_port_panel:
    refresh_seconds: 30
    stale_seconds: 180

superuser:
  name: admin
  email: admin@example.com

persistence:
  enabled: true
  storageClass: example-rwo
  size: 5Gi

postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      storageClass: example-rwo
      size: 20Gi

valkey:
  enabled: true
  primary:
    persistence:
      enabled: true
      storageClass: example-rwo
      size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

worker:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

initContainers:
  - name: collect-static
    image: ghcr.io/netbox-community/netbox:v4.6.5
    imagePullPolicy: IfNotPresent
    command: [sh, -c, "cp -R /opt/netbox/netbox/static/. /srv/netbox/static/"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: static
        mountPath: /srv/netbox/static

sidecars:
  - name: static-server
    image: busybox:1.38.0
    imagePullPolicy: IfNotPresent
    command: [httpd, -f, -p, "8081", -h, /srv]
    ports:
      - name: static-http
        containerPort: 8081
    readinessProbe:
      httpGet:
        path: /netbox/static/netbox.css
        port: static-http
      initialDelaySeconds: 2
      periodSeconds: 5
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: static
        mountPath: /srv/netbox/static
        readOnly: true
      - name: media
        mountPath: /srv/netbox/media
        readOnly: true

extraVolumes:
  - name: static
    emptyDir: {}
