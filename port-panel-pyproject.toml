[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-dcn-port-panel"
version = "0.1.0"
description = "DCN physical switch port panel for NetBox 4.6"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["netbox_dcn_port_panel*"]

[tool.setuptools.package-data]
netbox_dcn_port_panel = ["templates/**/*.html", "static/**/*"]
